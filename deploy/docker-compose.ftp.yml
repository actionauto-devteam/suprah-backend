version: '3.8'

services:
  ftp-worker:
    image: jolo0/actionauto-ftp:latest
    container_name: actionauto-ftp
    restart: unless-stopped
    
    env_file:
      - .env
    
    ports:
      # FTP Control Port
      - "21:21"
      # Passive Mode Data Ports
      - "21000-21010:21000-21010"
    
    environment:
      # Node Environment
      NODE_ENV: production
      
      # MongoDB Connection
      MONGODB_URI: ${MONGODB_URI}
      
      # FTP Server Configuration
      FTP_SERVER_PORT: 21
      FTP_PASSIVE_URL: ${VPS_PUBLIC_IP}
      FTP_PASV_MIN: 21000
      FTP_PASV_MAX: 21010
      FTP_SERVER_USER: ${FTP_SERVER_USER}
      FTP_SERVER_PASSWORD: ${FTP_SERVER_PASSWORD}
      FTP_UPLOAD_DIR: /app/ftp-uploads
      
      # JWT Configuration (required by config validation)
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      
      # Bcrypt Configuration (required by config validation)
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS}

      # Clerk Configuration (required by config validation)
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET}
      
      # Port (required by config validation)
      PORT: ${PORT}
    
    volumes:
      # Persist uploaded files (optional, since they're deleted after processing)
      - ftp-uploads:/app/ftp-uploads
    
    networks:
      - ftp-network
    
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "21"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  ftp-uploads:
    driver: local

networks:
  ftp-network:
    driver: bridge
