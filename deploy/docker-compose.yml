

services:
  # API Service
  api:
    image: devteamaau/actionauto-api:latest
    container_name: actionauto-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ORIGIN=https://www.suprah-app.com,https://suprah-app.com,http://localhost:3000,https://action-auto-app.vercel.app,https://action-auto-app.vercel.app/,https://api.suprah-app.com
    volumes:
      - ftp-uploads:/app/ftp-uploads
    networks:
      - app-network
    depends_on:
      - redis

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: actionauto-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: actionauto-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - api
    networks:
      - app-network

volumes:
  ftp-uploads:
    driver: local
  redis-data:
    driver: local

networks:
  app-network:
    driver: bridge
