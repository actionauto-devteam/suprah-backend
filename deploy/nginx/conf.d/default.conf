server {
    listen 80;
    server_name api.suprah-app.com www.suprah-app.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.suprah-app.com www.suprah-app.com;

    ssl_certificate /etc/letsencrypt/live/api.suprah-app.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.suprah-app.com/privkey.pem;
    
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        # Use Docker internal DNS (127.0.0.11) with a short TTL to handle container IP shifts
        resolver 127.0.0.11 valid=30s;
        set $upstream_api api;

        proxy_pass http://$upstream_api:5000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Real IP Forwarding
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support large file uploads (Syncs/Images)
        client_max_body_size 50M;
    }
}
 