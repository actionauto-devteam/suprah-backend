services:
  # 1. Redis: Internal Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: actionauto-redis
    restart: unless-stopped
    env_file:
      - ../.env
    command: >
      sh -c "redis-server --appendonly yes --requirepass $${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} PING"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # 2. Main API Service
  api:
    image: jolo0/actionauto-api:latest
    container_name: actionauto-api
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - PORT=5000

      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - ftp-uploads:/app/ftp-uploads
    depends_on:
      - redis
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # 3. FTP Sync Worker (FTPS)
  ftp-worker:
    image: jolo0/actionauto-ftp:latest
    container_name: actionauto-ftp
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "2121:2121"
      - "21000-21010:21000-21010"
    environment:
      NODE_ENV: production
      FTP_SERVER_PORT: 2121
      FTP_PASSIVE_URL: 54.191.44.38
      FTP_PASV_MIN: 21000
      FTP_PASV_MAX: 21010
      FTP_FORCE_TLS: "true"
      FTP_TLS_CERT_PATH: /app/certs/server.crt
      FTP_TLS_KEY_PATH: /app/certs/server.key
      # Networked Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ftp-uploads:/app/ftp-uploads
      - ./certs:/app/certs:ro
    depends_on:
      - redis
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2121"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # 4. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: actionauto-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # 5. Certbot (SSL Sidecar)
  certbot:
    image: certbot/certbot
    container_name: actionauto-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - app-network
    depends_on:
      - nginx

  # 6. Beszel Hub (Monitoring Dashboard)
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel-hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    env_file:
      - ../.env
    environment:
      APP_URL: https://beszel.suprah-app.com
    volumes:
      - beszel-data:/beszel_data
      - beszel-socket:/beszel_socket
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ['CMD', '/beszel', 'health', '--url', 'http://localhost:8090']
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 7. Beszel Agent (Collector)
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://127.0.0.1:8090
      # Exclude certbot since it's an ephemeral sidecar
      EXCLUDE_CONTAINERS: actionauto-certbot
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - beszel-agent-data:/var/lib/beszel-agent
      - beszel-socket:/beszel_socket
    depends_on:
      - beszel
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ftp-uploads:
    driver: local
  redis-data:
    driver: local
  beszel-data:
    driver: local
  beszel-agent-data:
    driver: local
  beszel-socket:
    driver: local

networks:
  app-network:
    driver: bridge