

services:
  # API Service (Built from local source)
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: actionauto-api-local
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - PORT=5000
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "5000:5000"
    volumes:
      - ftp-uploads:/app/ftp-uploads
    networks:
      - app-network
    depends_on:
      - redis

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: actionauto-redis-local
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 5s
      retries: 3

  # FTP Worker (Built from local source)
  ftp-worker:
    build:
      context: ..
      dockerfile: Dockerfile.ftp
    container_name: actionauto-ftp-local
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    environment:
      - NODE_ENV=development
      - FTP_PASSIVE_URL=127.0.0.1
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  # Beszel Hub — Monitoring Dashboard (HTTP only, no SSL for local)
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel-hub-local
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8090:8090"
    environment:
      APP_URL: http://localhost:8090
    volumes:
      - beszel_data_local:/beszel_data
      - beszel_socket_local:/beszel_socket
    networks:
      - app-network
    healthcheck:
      test: ['CMD', '/beszel', 'health', '--url', 'http://localhost:8090']
      start_period: 10s
      interval: 120s
      timeout: 10s
      retries: 3

  # Beszel Agent — Host + Container Metrics Collector
  # NOTE: network_mode: host on Windows Docker Desktop = Linux VM host network.
  # Host-level stats (CPU/RAM/disk) reflect the WSL2 VM, not Windows — acceptable for local testing.
  # Container-level metrics and all alerting work correctly.
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent-local
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
      EXCLUDE_CONTAINERS: actionauto-certbot
      LOG_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - beszel_agent_data_local:/var/lib/beszel-agent
      - beszel_socket_local:/beszel_socket
    depends_on:
      - beszel

volumes:
  ftp-uploads:
  redis-data:
  beszel_data_local:        # Beszel Hub PocketBase DB (historical metrics)
  beszel_agent_data_local:  # Agent machine fingerprint state
  beszel_socket_local:      # Unix socket shared between hub and agent

networks:
  app-network:
    driver: bridge
