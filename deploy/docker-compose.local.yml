

services:
  # API Service (Built from local source)
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: actionauto-api-local
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - PORT=5000
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "5000:5000"
    volumes:
      - ftp-uploads:/app/ftp-uploads
    networks:
      - app-network
    depends_on:
      - redis

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: actionauto-redis-local
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 5s
      retries: 3

  # FTP Worker (Built from local source)
  ftp-worker:
    build:
      context: ..
      dockerfile: Dockerfile.ftp
    container_name: actionauto-ftp-local
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    environment:
      - NODE_ENV=development
      - FTP_PASSIVE_URL=127.0.0.1
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

volumes:
  ftp-uploads:
  redis-data:

networks:
  app-network:
    driver: bridge
