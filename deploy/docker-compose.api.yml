services:
  # API Service
  api:
    image: jolo0/actionauto-api:latest
    container_name: actionauto-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      # Redis (for cache invalidation after FTP sync)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CORS_ORIGIN=https://www.suprah-app.com,https://suprah-app.com,http://localhost:3000
    volumes:
      - ftp-uploads:/app/ftp-uploads
    networks:
      - app-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: actionauto-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    container_name: actionauto-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - app-network
    depends_on:
      - api

volumes:
  ftp-uploads:
    driver: local

networks:
  app-network:
    driver: bridge
