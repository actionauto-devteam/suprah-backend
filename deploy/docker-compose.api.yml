version: '3.8'

services:
  # API Service
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: actionauto-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      - ftp-uploads:/app/ftp-uploads
    networks:
      - app-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: actionauto-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api
    containers:
      - actionauto-nginx
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    container_name: actionauto-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - app-network
    depends_on:
      - api

volumes:
  ftp-uploads:
    driver: local

networks:
  app-network:
    driver: bridge
