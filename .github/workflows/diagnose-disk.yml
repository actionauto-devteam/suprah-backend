name: Diagnose VPS Disk Usage

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check disk/Docker usage on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "===== df -h (overall disk usage per partition) ====="
            df -h

            echo ""
            echo "===== docker system df (Docker's own breakdown) ====="
            sudo docker system df -v

            echo ""
            echo "===== Top 15 largest directories under /var ====="
            sudo du -h --max-depth=3 /var 2>/dev/null | sort -rh | head -15

            echo ""
            echo "===== Top 15 largest directories under /opt ====="
            sudo du -h --max-depth=3 /opt 2>/dev/null | sort -rh | head -15

            echo ""
            echo "===== journal/log sizes ====="
            sudo journalctl --disk-usage 2>/dev/null || true
            sudo du -sh /var/log 2>/dev/null || true
