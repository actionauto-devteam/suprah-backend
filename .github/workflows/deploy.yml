name: Build and Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: production_deploy
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI_TEST: mongodb://127.0.0.1:27018/suprah_release_test
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run isolated release integration tests
        run: node node_modules/jest/bin/jest.js --config jest.release-integration.config.cjs --runInBand --silent

      - name: Run isolated unit tests
        run: node node_modules/jest/bin/jest.js --config jest.release-unit.config.cjs --runInBand --silent

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/actionauto-api:latest

      - name: Build and push FTP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ftp
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/actionauto-ftp:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync deployment configuration to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/*"
          target: "/opt/actionauto/deploy/"
          timeout: 30s
          command_timeout: 2m

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e

            cd /opt/actionauto/deploy

            # Free disk space BEFORE pulling — the old prune-after-deploy-only order meant
            # a disk that was already full from a prior deploy's leftovers had no chance to
            # recover before the next pull, so the pull itself failed with "no space left on
            # device" (2026-08-27 incident) and the cleanup step below never even ran.
            sudo docker image prune -a -f

            # Pull latest images for all services defined in prod manifest
            sudo docker compose --env-file /opt/actionauto/.env -f docker-compose.prod.yml pull

            # Restart the entire stack atomically
            sudo docker compose --env-file /opt/actionauto/.env -f docker-compose.prod.yml up -d --remove-orphans

            # Force Nginx to re-resolve the API's internal IP (Stale IP Prevention)
            sudo docker compose --env-file /opt/actionauto/.env -f docker-compose.prod.yml restart nginx

            # Cleanup old images to prevent EBS volume saturation
            sudo docker image prune -a -f

            # Verification
            sudo docker ps
