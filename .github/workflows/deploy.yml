name: Build and Deploy to VPS

on:
  push:
    branches:
      - main  # Adjust this if your main branch is named differently

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/actionauto-api:latest

      - name: Build and push FTP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ftp
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/actionauto-ftp:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync deployment configuration to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/*"
          target: "/opt/actionauto/"

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/actionauto/deploy
            
            # Pull latest images for all services defined in prod manifest
            docker compose --env-file /opt/actionauto/.env -f docker-compose.prod.yml pull
            
            # Restart the entire stack atomically
            docker compose --env-file /opt/actionauto/.env -f docker-compose.prod.yml up -d --remove-orphans
            
            # Force Nginx to re-resolve the API's internal IP (Stale IP Prevention)
            docker compose --env-file /opt/actionauto/.env -f docker-compose.prod.yml restart nginx
            
            # Cleanup old images to prevent EBS volume saturation
            docker image prune -f
            
            # Verification
            docker ps
